<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>inlineNotes</title>
    <!--
      The popup's **paint**. This document is not the two-line shell the options document
      is: `body` is the box the window is drawn from, so `body` is what has to carry the
      `A125` cream, or the user agent's white shows as a band around the panel (ruling
      `A145`, kept by `A147`). Being painted does not make it the surface: the shape is
      the card's, not this box's.

      Why here and not in the component. Chrome paints the document box with the user
      agent's white; `app-root` and `.popup` are cream *inside* it, so a fill declared
      only there never reaches the window edge. So the paint belongs to the box that is
      the window, and the component is content inside it.

      **The document paints; it does not shape** (rulings `A146`, `A147`, superseding
      `A145`). `A145` also gave this box the panel-filling geometry (`width: 100%`,
      `min-height: 100vh`) and the rounded corners (`border-radius: 12px`, with
      `overflow: hidden` to clip the fill to the same arc). Both halves of that added shape
      are withdrawn — the paint above is kept — and both are measured on the reader's
      screenshot (`test_img/…224902.png`, task `t14-04`):

      - the width collapsed the cream to `100px`, leaving the text a `66px` column, and
        the title, the notice and the empty state each wrapped to three lines — a block box
        with `width: auto` and `margin: 0` already fills the panel, so no geometry
        declaration is needed here at all, and the `320px` belongs to `.popup` (`A147`);
      - the radius is **not rendered**: the four cream corners at `(96,72)`, `(195,72)`,
        `(96,335)`, `(195,335)` are square and `(97,73)`, `(98,74)`, `(99,75)` show no
        anti-aliased step. Chrome draws a popup window as a rectangle and does not clip the
        document to a `border-radius`, so no rounding is possible in an MV3 popup (`A146`)
        and the popup ships as a cream rectangle that fills the window.

      What is left is deliberately one rule of two declarations: the cream paint and
      `margin: 0`. A `box-sizing: border-box` with no width, padding or border is a no-op,
      and a declaration nothing measures is what `S14-21` flagged; it goes with the
      geometry it belonged to.

      No frame **on this document**: no `border`, no `outline`, no `box-shadow` here — the
      paint is all this box owns. The drawn frame lives on the **card** (`.popup`), which
      carries the reader's thickened `2px solid #a6cbdc` frame and its `12px` radius
      (ruling `A148`, task `t14-04`). The palette is `A125` only, and every other visual
      rule still lives in the component stylesheet.
    -->
    <style>
      body {
        margin: 0;
        background: #fdf7ee;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
